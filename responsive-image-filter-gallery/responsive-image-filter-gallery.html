<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header><h1>Responsive Image Filter Gallery</h1></header>
  <main class="gallery">
    <figure><img src="" alt="img1"><figcaption>Blur</figcaption></figure>
    <figure><img src="" alt="img2"><figcaption>Grayscale</figcaption></figure>
    <figure><img src="" alt="img3"><figcaption>Sepia</figcaption></figure>
    <figure><img src="" alt="img4"><figcaption>Brightness</figcaption></figure>
    <figure><img src="" alt="img5"><figcaption>Contrast</figcaption></figure>
    <figure><img src="" alt="img6"><figcaption>Hue Rotate</figcaption></figure>
  </main>
  <footer>Hover to remove filters.</footer>
</body>
</html>
