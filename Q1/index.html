<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q1 - Pseudo-Classes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Pseudo-Classes Demo</h1></header>
  <main>
    <section class="row">
      <div class="example">
        <a href="#" class="link">Hover me ( :hover )</a>
        <p class="note">:hover changes link background on mouse over.</p>
      </div>
      <div class="example">
        <button class="btn">Focus me ( :focus )</button>
        <p class="note">:focus shows outline when keyboard-focused.</p>
      </div>
      <div class="example">
        <button class="btn active-demo">Active ( :active )</button>
        <p class="note">:active shows momentary press state.</p>
      </div>
      <div class="example">
        <ul class="items">
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
          <li>Item 4</li>
        </ul>
        <p class="note">:nth-child(odd) styles odd list items.</p>
      </div>
    </section>
  </main>
  <footer>Use Tab to focus buttons.</footer>
</body>
</html>
