<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Character Counter</title>
  <link rel="stylesheet" href="char-counter.css">
</head>
<body>
  <h1>Live Character Counter (max 100)</h1>
  <textarea id="messageBox" rows="6" maxlength="200"></textarea>
  <div>
    <span id="charCounter">100</span> characters remaining
  </div>
  <button id="resetBtn">Reset</button>

  <script src="char-counter.js"></script>
</body>
</html>
