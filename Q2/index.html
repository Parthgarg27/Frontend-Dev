<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q2 - Tooltips</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="center">
    <h1>Tooltip Demo (CSS only)</h1>
    <div class="icons">
      <div class="item">
        <span class="trigger">🔍</span>
        <span class="tooltip">Search the site</span>
      </div>
      <div class="item">
        <span class="trigger">💬</span>
        <span class="tooltip">Send a message</span>
      </div>
      <div class="item">
        <span class="trigger">⚙️</span>
        <span class="tooltip">Settings</span>
      </div>
    </div>
  </main>
</body>
</html>
