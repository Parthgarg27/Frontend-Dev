<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q4 - CSS Selectors Practice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Selectors Practice</h1></header>
  <main>
    <section>
      <p id="intro">Element selector styles this paragraph (element).</p>
      <p class="highlight">This paragraph is selected by class selector.</p>
      <a href="#" title="external" class="link">Attribute selector example</a>
      <div class="wrap">
        <h2>Combinators</h2>
        <p>Direct child: <span class="child">I am direct child</span></p>
        <p>Adjacent: <span class="adj">Adjacent span</span></p>
        <p>General sibling: <span class="sib">Sibling span</span></p>
      </div>
    </section>
  </main>
  <footer>Footer — demonstrates semantic structure.</footer>
</body>
</html>
