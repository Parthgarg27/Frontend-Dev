<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center mb-0">Division Calculator</h3>
                    </div>
                    <div class="card-body">
                        <form id="calcForm">
                            <div class="mb-3">
                                <label for="num1" class="form-label">First Number (Dividend)</label>
                                <input type="number" class="form-control" id="num1" placeholder="Enter first number" required>
                            </div>
                            <div class="mb-3">
                                <label for="num2" class="form-label">Second Number (Divisor)</label>
                                <input type="number" class="form-control" id="num2" placeholder="Enter second number" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Calculate</button>
                        </form>
                        <div id="result" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
