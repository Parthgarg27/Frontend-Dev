<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q10 - Mini UI Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><h1>My Mini UI</h1></header>
  <main class="container">
    <section class="card">
      <form>
        <label>Username<input type="text" placeholder="name"></label>
        <label>Password<input type="password" placeholder="password"></label>
        <div class="actions">
          <button class="btn">Login</button>
          <button class="btn alt" type="button">Cancel</button>
        </div>
      </form>
      <img src="" alt="small" class="thumb" aria-hidden="true">
    </section>
  </main>
  <footer class="site-footer">© Mini UI</footer>
</body>
</html>
