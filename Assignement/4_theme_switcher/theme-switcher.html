<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="theme-switcher.css">
</head>
<body>
  <h1>Theme Switcher (Light, Dark, Blue)</h1>
  <div>
    <button data-theme="light" class="theme-btn">Light</button>
    <button data-theme="dark" class="theme-btn">Dark</button>
    <button data-theme="blue" class="theme-btn">Blue</button>
  </div>
  <p>Current theme saved in <code>data-theme</code> attribute on &lt;body&gt;.</p>

  <script src="theme-switcher.js"></script>
</body>
</html>
