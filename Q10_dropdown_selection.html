<!-- Q10_dropdown_selection.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q10 - Dropdown Selection Page</title>
</head>
<body>
  <header>
    <h1>Location & Favorite Place Selection</h1>
  </header>

  <main>
    <form>
      <label for="country">Country:</label><br>
      <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">United States</option>
        <option value="uk">United Kingdom</option>
      </select><br><br>

      <label for="state">State:</label><br>
      <select id="state" name="state">
        <option value="maharashtra" selected>Maharashtra</option>
        <option value="karnataka">Karnataka</option>
        <option value="delhi">Delhi</option>
      </select><br><br>

      <label for="city">City:</label><br>
      <select id="city" name="city">
        <option value="mumbai" selected>Mumbai</option>
        <option value="pune">Pune</option>
        <option value="bangalore">Bengaluru</option>
      </select><br><br>

      <label for="place">Favorite Tourist Place:</label><br>
      <select id="place" name="place">
        <option value="gateway" selected>Gateway of India</option>
        <option value="elephanta">Elephanta Caves</option>
        <option value="marine">Marine Drive</option>
      </select>
    </form>

    <!-- Summary paragraph -->
    <p>Selected: Country — India; State — Maharashtra; City — Mumbai; Favorite Place — Gateway of India.</p>
  </main>

  <footer>
    <p>© 2025 Selection Demo</p>
  </footer>
</body>
</html>
